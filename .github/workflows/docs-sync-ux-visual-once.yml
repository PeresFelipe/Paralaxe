name: One-shot UX visual sync

on:
  push:
    paths:
      - .github/workflows/docs-sync-ux-visual-once.yml

permissions:
  contents: write

jobs:
  sync-ux-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch UX documentation
        run: python scripts/sync-ux-visual-once.py

      - name: Commit documentation update and cleanup
        shell: bash
        run: |
          rm -f scripts/sync-ux-visual-once.py .github/workflows/docs-sync-ux-visual-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/UX-GDD.md docs/implementation/M5.5-UX-FOUNDATION.md scripts/sync-ux-visual-once.py .github/workflows/docs-sync-ux-visual-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: freeze UX foundation and add visual design 0.1"
          git push
