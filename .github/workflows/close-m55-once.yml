name: close-m55-once
on: push
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/close-m55.py
      - run: |
          rm scripts/close-m55.py .github/workflows/close-m55-once.yml
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m "docs: close M5.5 and resume M6"
          git push
