name: One-shot M5.5 cleanup

on:
  push:
    paths:
      - .github/workflows/fix-m55-pending-once.yml

permissions:
  contents: write

jobs:
  cleanup-m55:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean stale pending decisions
        run: python scripts/fix-m55-pending-once.py

      - name: Commit cleanup and remove temporary files
        shell: bash
        run: |
          rm -f scripts/fix-m55-pending-once.py .github/workflows/fix-m55-pending-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation/M5.5-UX-FOUNDATION.md scripts/fix-m55-pending-once.py .github/workflows/fix-m55-pending-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: remove stale M5.5 UX questions"
          git push
