name: m6-noop-restore-once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: python scripts/m6-fix-noop-restore.py
      - run: pnpm --filter @greywake/domain test
      - run: pnpm --filter @greywake/content test
      - run: |
          rm scripts/m6-fix-noop-restore.py .github/workflows/m6-noop-restore-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/domain/src/combat.ts packages/domain/src/combat.test.ts scripts/m6-fix-noop-restore.py .github/workflows/m6-noop-restore-once.yml
          git commit -m "fix(combat): skip no-op restore abilities"
          git push
