name: m6-inventory-capacity-once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: python scripts/m6-inventory-capacity.py
      - run: pnpm check
      - run: pnpm build
      - name: Commit validated capacity fixes and cleanup
        run: |
          rm scripts/m6-inventory-capacity.py .github/workflows/m6-inventory-capacity-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/domain/src/idle.ts packages/domain/src/crafting.ts packages/domain/src/economy.ts packages/domain/src/dungeon.ts packages/domain/src/inventoryCapacity.test.ts apps/game/src/App.tsx scripts/m6-inventory-capacity.py .github/workflows/m6-inventory-capacity-once.yml
          git commit -m "fix(game): enforce Build 0.1 inventory capacity across acquisition flows"
          git push
