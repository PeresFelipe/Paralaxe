name: Sync Phase 3 status once

on: push

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize M5.5 implementation status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          m55 = Path('docs/implementation/M5.5-UX-FOUNDATION.md')
          text = m55.read_text()
          text = text.replace('Fase 3 — Implementação da UX                 ⏳', 'Fase 3 — Implementação da UX                 🟡 EM IMPLEMENTAÇÃO')
          text = text.replace(
              'A fundação de arquitetura de informação, estados, fluxos, responsividade, mídia e direção visual 0.1 está **congelada para prototipagem**. O protótipo hi-fi navegável v0.2 está pronto para teste. Isso não encerra o M5.5: playtest, refinamento pós-playtest e implementação continuam pendentes.',
              'A fundação de arquitetura de informação, estados, fluxos, responsividade, mídia e direção visual 0.1 está **congelada**. O protótipo hi-fi navegável v0.2 permanece como referência de validação e a **Fase 3 já começou na build real**. Isso não encerra o M5.5: playtest humano, refinamentos e conclusão da migração continuam pendentes.'
          )
          text = text.replace('### Fase 3 — implementação ⏳', '### Fase 3 — implementação 🟡')
          text = text.replace(
              'Pendente:\n\n25. migração dos workbenches para views normais ou rota interna de desenvolvimento;\n26. implementação do shell e navegação;\n27. implementação dos estados/fluxos aprovados;\n28. validação manual do fluxo completo sem depender de conhecimento técnico.',
              'Em andamento:\n\n25. ✅ runtime raiz agora renderiza apenas `App`, sem workbenches empilhados;\n26. ✅ `GameShell` canônico com `Personagem / Atividades / Aventura / Cidade`, Jornada e Inventário rápido;\n27. ✅ Mercado, Combate e Dungeon migrados para views controladas pelo mesmo save ativo;\n28. ✅ continuidade Idle integrada aos estados de risco sem exigir parada/reinício manual;\n29. ✅ criação guiada e retorno offline integrados ao novo shell;\n30. 🟡 completar/refinar fluxos funcionais das áreas ainda sem domínio próprio e validar comportamento real;\n31. ⏳ playtest/manual end-to-end da build migrada antes de encerrar M5.5.'
          )
          m55.write_text(text)

          status = Path('docs/implementation/CURRENT-STATUS.md')
          text = status.read_text()
          text = text.replace(
              'O M6 — Build 0.1 validável fica temporariamente pausado enquanto a experiência de navegação é redesenhada. A decisão veio de playtest manual: a Build já possui vários sistemas funcionais, mas a interface atual ainda se comporta como um conjunto de workbenches técnicos empilhados, não como um jogo com fluxo claro.',
              'O M6 — Build 0.1 validável permanece temporariamente pausado enquanto concluímos o M5.5. A arquitetura de UX já foi aprovada e a **Fase 3 está em implementação na build real**: o shell canônico substituiu a raiz de workbenches empilhados e os sistemas estão sendo migrados para um único fluxo de jogo.'
          )
          text = text.replace('M5.5 — UX Foundation                      🟡 EM DEFINIÇÃO', 'M5.5 — UX Foundation                      🟡 EM IMPLEMENTAÇÃO')
          text = text.replace(
              '## Problema de UX identificado\n\nA aplicação normal ainda é conceitualmente composta por múltiplos componentes independentes:\n\n```text\n<App />\n<MarketWorkbench />\n<CombatWorkbench />\n<DungeonWorkbench />\n```\n\nIsso foi útil para desenvolvimento incremental, mas não deve ser a arquitetura final da experiência.\n\nO M5.5 deve convergir para algo conceitualmente próximo de:\n\n```text\n<GameShell>\n  <Navigation />\n  <GameView />\n  <ActivityStatus />\n</GameShell>\n```\n\ncom apenas uma `GameView` principal por vez.\n\n## Hipótese atual de arquitetura de informação\n\nAinda não aprovada como decisão final:\n\n```text\nPersonagem\nCidade Livre\n  Taverna\n  Mercado\n  Ferreiro\n  Banco\n  Relicário\nAtividades\n  Coleta\n  Produção\nCombate\nDungeon\n```\n\nA Cidade Livre deve funcionar como o contexto central fora de combate/Dungeon.\n\nAtividades Idle devem continuar em andamento enquanto o jogador navega e ter status persistente no shell.\n\nCombate e Dungeon devem reduzir distrações e assumir foco próprio.',
              '## Migração de UX — Fase 3\n\nA raiz antiga com `App`, `MarketWorkbench`, `CombatWorkbench` e `DungeonWorkbench` empilhados foi removida. O runtime agora renderiza apenas `App`, que controla um único save ativo e apresenta o `GameShell`.\n\nArquitetura aprovada em implementação:\n\n```text\nNAVEGAÇÃO PRINCIPAL\nPersonagem | Atividades | Aventura | Cidade\n\nCONTINUIDADE GLOBAL\nJornada + Inventário rápido + atividade Idle atual\n\nESTADOS DE RISCO\nPreparação → Combate / Dungeon → retorno seguro\n```\n\nMercado, Combate e Dungeon agora recebem o mesmo save ativo do shell. Combate e Dungeon deixam de operar como mini-apps com seleção própria de save. A atividade Idle continua em navegação segura, é congelada ao confirmar risco e é retomada automaticamente ao retornar à segurança.'
          )
          marker = '- testes automatizados de domínio/content/persistence.\n'
          addition = '''- testes automatizados de domínio/content/persistence.\n- `GameShell` canônico integrado ao runtime;\n- navegação principal `Personagem / Atividades / Aventura / Cidade`;\n- Jornada e Inventário rápido como camadas globais de continuidade;\n- Mercado, Combate e Dungeon controlados pelo save ativo único;\n- continuidade Idle integrada a Combate/Dungeon sem parada manual;\n- criação de personagem em fluxo guiado;\n- retorno offline com reconciliação em estado próprio;\n- visual runtime alinhado à Direção Visual 0.1 e estratégia responsiva/mobile.\n'''
          if marker in text and '`GameShell` canônico integrado ao runtime;' not in text:
              text = text.replace(marker, addition)
          status.write_text(text)
          PY
      - name: Commit docs and remove workflow
        shell: bash
        run: |
          rm .github/workflows/sync-phase3-status-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/implementation/M5.5-UX-FOUNDATION.md docs/implementation/CURRENT-STATUS.md .github/workflows/sync-phase3-status-once.yml
          git commit -m 'docs: mark M5.5 Phase 3 implementation started'
          git push
