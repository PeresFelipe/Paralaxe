name: phase3-attributes-once
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/wire-attributes-phase3.py
      - run: |
          rm scripts/wire-attributes-phase3.py .github/workflows/phase3-attributes-once.yml
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m "feat(game): enable persistent attribute distribution"
          git push
