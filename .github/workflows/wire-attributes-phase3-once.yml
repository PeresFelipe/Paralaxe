name: Wire attributes Phase 3 once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run Phase 3 attribute wiring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply attribute wiring
        run: python scripts/wire-attributes-phase3.py
      - name: Commit runtime changes and cleanup
        run: |
          rm scripts/wire-attributes-phase3.py
          rm .github/workflows/wire-attributes-phase3-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game/src/App.tsx apps/game/src/GameShell.tsx scripts/wire-attributes-phase3.py .github/workflows/wire-attributes-phase3-once.yml
          git commit -m "feat(game): enable persistent attribute distribution"
          git push
