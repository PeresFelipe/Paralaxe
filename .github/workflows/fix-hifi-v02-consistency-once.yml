name: One-shot hi-fi v0.2 consistency fix

on:
  push:
    paths:
      - .github/workflows/fix-hifi-v02-consistency-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch prototype consistency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/prototypes/greywake-hifi-flow-v0.2.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ('content:"Bolsa";font-size:10px', 'content:"Inv.";font-size:10px'),
            ("function syncActivity(){document.getElementById('idleName').textContent=`${activity.type} · ${activity.target}`;document.getElementById('idleMeta').textContent=activity.meta;document.getElementById('journeyActivity').textContent=`${activity.type} · ${activity.target}`;document.getElementById('productionCurrent').textContent=`${activity.type} · ${activity.target}`;document.getElementById('productionReplaceCopy').innerHTML=`Ao iniciar, <b style=\"color:var(--text)\">${activity.type} · ${activity.target}</b> será substituída.`}", "function syncActivity(){document.getElementById('idleName').textContent=`${activity.type} · ${activity.target}`;document.getElementById('idleMeta').textContent=activity.meta;document.getElementById('journeyActivity').textContent=`${activity.type} · ${activity.target}`;document.getElementById('productionCurrent').textContent=`${activity.type} · ${activity.target}`;syncMiningActiveLabels();syncProductionDecision()}\nfunction syncMiningActiveLabels(){document.querySelectorAll('#miningResources [data-resource]').forEach(c=>{const state=c.querySelector('.resource-state');if(!state)return;const isActive=activity.type==='Mineração'&&activity.target===c.dataset.resource;state.textContent=isActive?'ATIVO':(c.dataset.resource==='Stán'?'NOVO':'')})}\nfunction syncProductionDecision(){const current=activity.type==='Metalurgia'&&activity.target==='Cloch Tratada';const copy=document.getElementById('productionReplaceCopy'),btn=document.getElementById('startProduction');if(!copy||!btn)return;copy.innerHTML=current?'Esta já é sua atividade atual.':`Ao iniciar, <b style=\"color:var(--text)\">${activity.type} · ${activity.target}</b> será substituída.`;btn.disabled=current;btn.textContent=current?'Atividade atual':'Iniciar produção'}"),
            ("document.getElementById('jump').value=id;closeSheets();if(id==='character'&&charTarget)openCharTab(charTarget);window.scrollTo({top:0,behavior:'auto'});announce(`Tela ${id}`)}", "document.getElementById('jump').value=id;closeSheets();if(id==='character'&&charTarget)openCharTab(charTarget);if(id==='mining')miningDetails(selectedMining);if(id==='production')syncProductionDecision();window.scrollTo({top:0,behavior:'auto'});announce(`Tela ${id}`)}"),
            ("function startSelectedMining(){activity={type:'Mineração',target:selectedMining,meta:'próximo ciclo em 1,3 s'};syncActivity();document.querySelectorAll('#miningResources [data-resource]').forEach(c=>{const state=c.querySelector('.resource-state');if(state)state.textContent=c.dataset.resource===selectedMining?'ATIVO':''});miningDetails(selectedMining);announce(`Mineração de ${selectedMining} iniciada. Atividade anterior substituída.`)}", "function startSelectedMining(){activity={type:'Mineração',target:selectedMining,meta:'próximo ciclo em 1,3 s'};syncActivity();miningDetails(selectedMining);announce(`Mineração de ${selectedMining} iniciada. Atividade anterior substituída.`)}"),
            ("function startProduction(){const old=`${activity.type} · ${activity.target}`;activity={type:'Metalurgia',target:'Cloch Tratada',meta:'próximo ciclo em 4,0 s'};syncActivity();const f=document.getElementById('productionFeedback');f.hidden=false;f.textContent=`Produção iniciada. ${old} foi substituída por Metalurgia · Cloch Tratada.`;announce(f.textContent)}", "function startProduction(){if(activity.type==='Metalurgia'&&activity.target==='Cloch Tratada')return;const old=`${activity.type} · ${activity.target}`;activity={type:'Metalurgia',target:'Cloch Tratada',meta:'próximo ciclo em 4,0 s'};syncActivity();const f=document.getElementById('productionFeedback');f.hidden=false;f.textContent=`Produção iniciada. ${old} foi substituída por Metalurgia · Cloch Tratada.`;announce(f.textContent)}")
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('expected pattern missing: ' + old[:80])
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-hifi-v02-consistency-once.yml
          git add docs/prototypes/greywake-hifi-flow-v0.2.html
          git commit -m "docs: refine hi-fi v0.2 interaction consistency"
          git push
