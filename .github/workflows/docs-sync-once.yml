name: One-shot GDD sync

on:
  push:
    paths:
      - .github/workflows/docs-sync-once.yml

permissions:
  contents: write

jobs:
  sync-gdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch GDD
        run: python scripts/sync-gdd-once.py

      - name: Commit GDD update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GDD.md
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "docs: consolidate approved UX foundation in GDD"
          git push
