          replace_once(r'# 44\. Arte\n.*?(?=# 45\. Regras documentais)', section_44, 'secao 44')

          old_baseline = '41. a apresentação do jogo é Web-first, 2D e UI-heavy, com interface suave, consistente e fortemente orientada a feedback.'
          new_baseline = '41. a apresentação do jogo é Web-first, 2D e UI-heavy, com interface suave, consistente e fortemente orientada a feedback;\n42. no estado seguro, a arquitetura de informação principal é Personagem, Atividades, Aventura e Cidade, com Jornada como camada global de continuidade;\n43. atividade Idle continua em contextos seguros e durante Preparação, pausa em Combate/Dungeon e retoma automaticamente no retorno à segurança;\n44. Preparação, Combate e Dungeon são estados contextuais próprios e não destinos permanentes da navegação principal;\n45. o sistema visual reserva mídia por função: 16:9 contextual, 4:5 retratos, 1:1 itens/recursos/Técnicas/Relíquias.'
          if old_baseline not in text:
              raise SystemExit('baseline UX: expected text not found')
          text = text.replace(old_baseline, new_baseline, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit GDD update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GDD.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No GDD changes produced"
            exit 1
          fi
          git commit -m "docs: consolidate approved UX foundation in GDD"
          git push
