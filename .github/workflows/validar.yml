# Executa os mesmos comandos de verificação documentados no README.
name: Validar versão 0.1

# Valida tanto a main após um envio quanto as propostas de alteração destinadas a ela.

on:
  push:
    branches: [main, codex/vigilia-cidade-evolutiva-2026-11-03, codex/vigilia-cidade-artes-completas-2026-11-03, codex/legado-cidade-viva]
  pull_request:
    branches: [main]

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Usa a versão do pnpm indicada em packageManager no package.json da raiz.
      - name: Ativar Corepack
        run: corepack enable

      # A opção atual permite ajustar a resolução do lockfile durante a instalação da automação.
      - name: Instalar dependências
        run: pnpm install --no-frozen-lockfile

      # pnpm verificar também confere a cobertura do catálogo de créditos e os avisos locais.
      - name: Verificar código, tipos e testes
        run: pnpm verificar

      # Gera os arquivos finais e o aplicativo web instalável; esta etapa não publica um site.
      - name: Compilar versão de produção
        run: pnpm compilar
