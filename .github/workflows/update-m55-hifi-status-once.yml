name: One-shot M5.5 hi-fi status sync

on:
  push:
    paths:
      - .github/workflows/update-m55-hifi-status-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update M5.5 status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/implementation/M5.5-UX-FOUNDATION.md')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ('Fase 2.5 — Protótipo alta fidelidade         ⏳', 'Fase 2.5 — Protótipo alta fidelidade         ✅'),
            ('A fundação de arquitetura de informação, estados, fluxos, responsividade, mídia e direção visual 0.1 está **congelada para prototipagem**. Isso não encerra o M5.5: protótipo, playtest e implementação continuam pendentes.', 'A fundação de arquitetura de informação, estados, fluxos, responsividade, mídia e direção visual 0.1 está **congelada para prototipagem**. O protótipo hi-fi navegável v0.2 está pronto para teste. Isso não encerra o M5.5: playtest, refinamento pós-playtest e implementação continuam pendentes.'),
            ('20. hierarquia visual, superfícies, acento, tipografia funcional e escala inicial de espaçamento.\n\nPendente:\n\n21. protótipo de alta fidelidade começando por Atividades → Mineração;\n22. derivação das demais telas principais;\n23. playtest dos cenários críticos;\n24. refinamentos visuais e de interação a partir de evidência.', '20. hierarquia visual, superfícies, acento, tipografia funcional e escala inicial de espaçamento;\n21. protótipo de alta fidelidade começando por Atividades → Mineração;\n22. derivação navegável das principais telas em `greywake-hifi-flow-v0.2.html`;\n23. auditoria heurística e checklist de readiness para playtest.\n\nPendente:\n\n24. playtest dos cenários críticos;\n25. refinamentos visuais e de interação a partir de evidência.'),
            ('25. migração dos workbenches para views normais ou rota interna de desenvolvimento;\n26. implementação do shell e navegação;\n27. implementação dos estados/fluxos aprovados;\n28. validação manual do fluxo completo sem depender de conhecimento técnico.', '26. migração dos workbenches para views normais ou rota interna de desenvolvimento;\n27. implementação do shell e navegação;\n28. implementação dos estados/fluxos aprovados;\n29. validação manual do fluxo completo sem depender de conhecimento técnico.'),
            ('8. construir o protótipo de alta fidelidade começando por Atividades → Mineração;\n9. derivar as demais telas principais a partir da linguagem validada;\n10. executar playtest dos cenários críticos e registrar problemas observados;\n11. aplicar refinamentos de posição, densidade, hierarquia e acessibilidade derivados de evidência;\n12. migrar os workbenches para a experiência final aprovada durante a Fase 3.', '8. executar playtest dos cenários críticos usando `docs/prototypes/PLAYTEST-HIFI-V0.2.md` e registrar problemas observados;\n9. aplicar refinamentos de posição, densidade, hierarquia e acessibilidade derivados de evidência;\n10. migrar os workbenches para a experiência final aprovada durante a Fase 3.')
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('expected pattern missing: ' + old[:100])
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit status and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-m55-hifi-status-once.yml
          git add docs/implementation/M5.5-UX-FOUNDATION.md
          git commit -m "docs: mark M5.5 hi-fi prototype ready for playtest"
          git push
